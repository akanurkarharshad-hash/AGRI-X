<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGRI-X Rover</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header><h1>AGRI-X</h1><span id="connection">Connecting…</span></header>
    <section class="controls" aria-label="Rover movement">
      <i></i><button data-move="F">▲ Forward</button><i></i>
      <button data-move="L">◀ Left</button><button id="stop">■ STOP</button><button data-move="R">Right ▶</button>
      <i></i><button data-move="B">▼ Backward</button><i></i>
    </section>
    <label>Drive speed <input id="speed" type="range" min="0" max="255" value="180"><output>180</output></label>
    <section class="sensors">
      <h2>Live telemetry</h2>
      <dl id="telemetry"><dt>Air temperature</dt><dd data-field="t">--</dd><dt>Humidity</dt><dd data-field="h">--</dd>
        <dt>Soil temperature</dt><dd data-field="st">--</dd><dt>Moisture</dt><dd data-field="m">--</dd>
        <dt>pH</dt><dd data-field="ph">--</dd><dt>EC</dt><dd data-field="ec">--</dd>
        <dt>N / P / K</dt><dd><span data-field="n">--</span> / <span data-field="p">--</span> / <span data-field="k">--</span></dd>
        <dt>GPS</dt><dd><span data-field="lat">--</span>, <span data-field="lon">--</span></dd>
        <dt>Drive</dt><dd data-field="run">--</dd>
      </dl>
    </section>
    <p>Hold a direction button or W A S D to move. STOP always sends immediately.</p>
  </main>
</body>
</html>
