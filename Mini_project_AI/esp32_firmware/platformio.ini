[platformio]
; Default environment
default_envs = esp32dev

[env:esp32dev]
; Target ESP32 DevKit V1 / ESP32 Dev Module
platform = espressif32
board = esp32dev
framework = arduino

; Build configuration
build_flags =
    -Wall
    -O2

; Libraries managed by PlatformIO
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.8
    adafruit/Adafruit GFX Library@^1.11.9

; Serial monitor configuration
monitor_speed = 115200
monitor_filters = 
    default
    time
    log2file

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; Debug settings (optional - comment out if not using debugger)
; debug_tool = esp-prog
; debug_init_break = tbreak setup
